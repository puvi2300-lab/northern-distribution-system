<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c8321e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RAJ BROS">
<title>RAJ BROS MARKETING</title>
<style>
:root{--bg:#f3f5f4;--card:#fff;--ink:#16201f;--mute:#5d6b69;--line:#dbe3e1;--acc:#c8321e;--ok:#17803d;--warn:#b45309}
@media(prefers-color-scheme:dark){:root{--bg:#111716;--card:#1a2321;--ink:#eaf0ee;--mute:#9aaaa7;--line:#2b3735;--acc:#ef5a43;--ok:#4ade80;--warn:#fbbf24}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
#app{max-width:980px;margin:0 auto;padding:0 12px 100px}
header{padding-top:calc(12px + env(safe-area-inset-top,0px))!important;display:flex;align-items:center;gap:10px;padding:12px 0}
header b{font-size:18px;flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}
.mute{color:var(--mute);font-size:13px}
.stats{display:flex;gap:8px;overflow-x:auto;position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0}
.stats div{flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:8px;padding:6px 12px}
.stats span{display:block;font-size:12px;color:var(--mute)}
.stats b{font-size:17px}
nav{display:flex;gap:6px;margin:8px 0;overflow-x:auto}
button{font:inherit;min-height:38px;touch-action:manipulation;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 14px;white-space:nowrap}
button.on,button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.sm{padding:4px 10px;font-size:13px;min-height:30px}
button:disabled{opacity:.4}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
input,select{font:inherit;font-size:16px;-webkit-appearance:none;appearance:none;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 8px;width:100%}
td input{width:86px}
td:first-child,th:first-child{position:sticky;left:0;background:var(--card);z-index:1}
tr.grp td:first-child{background:var(--bg)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
@media(max-width:600px){#app{padding:0 8px 100px}td:first-child{min-width:130px;font-size:14px}}
th,td{padding:5px 6px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:13px;color:var(--mute)}
tr.grp td{background:var(--bg);font-weight:600;padding:8px 6px}
input.low{border-color:var(--warn);color:var(--warn)}
input.zero,input.over{border-color:var(--acc);color:var(--acc)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.bill ul{margin:6px 0;padding-left:18px}
.bill.cancelled{opacity:.85;border-left:4px solid var(--acc)}
.bill.active{border-left:4px solid var(--ok)}
.badge{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line)}
.badge.active{color:var(--ok)}.badge.cancelled{color:var(--acc)}
.note{padding:10px 12px;border-radius:8px;margin:10px 0}
.note.err{background:rgba(200,50,30,.12);color:var(--acc)}
.note.ok{background:rgba(23,128,61,.14);color:var(--ok)}
.login{max-width:360px;margin:12vh auto;display:grid;gap:10px}
.seg{display:flex;gap:6px}.seg button{flex:1}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.bar div{max-width:980px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:min(440px,94vw)}
dialog label{display:block;margin:8px 0 3px;font-size:13px;color:var(--mute)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chip{border-radius:99px;padding:7px 14px}
.chip i{font-style:normal;font-size:12px;background:var(--ok);color:#fff;border-radius:99px;padding:1px 7px;margin-left:6px}
.chip.on i{background:#fff;color:var(--acc)}
.prod{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.prod:last-child{border-bottom:0}
.step{display:flex;align-items:center;gap:6px}
.step button{width:42px;padding:0;font-size:20px}
.step input{width:64px;text-align:center}
.sel{margin:0;padding-left:18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.err{color:var(--acc)}
#printArea{display:none}
@media print{
  #printArea.inv{padding:10mm}
  #printArea.rcpt{padding:3mm 4mm;width:80mm;font:11px/1.3 "Courier New",monospace}
  html,body{background:#fff!important}
  #app,#dlg{display:none!important}
  #printArea{display:block!important;color:#000;font:13px/1.4 Arial,Helvetica,sans-serif}
  #printArea h1{font-size:20px;margin:0;text-align:center}
  #printArea .c{text-align:center;margin:2px 0}
  #printArea table{width:100%;min-width:0;border-collapse:collapse;margin:10px 0}
  #printArea th,#printArea td{border-bottom:1px solid #999;padding:4px 3px;text-align:left;color:#000;background:#fff;position:static}
  #printArea .r{text-align:right}
  #printArea .tot td{font-weight:bold;font-size:15px;border-top:2px solid #000}
  #printArea .stamp{border:2px solid #000;text-align:center;font-weight:bold;font-size:18px;padding:4px;margin:8px 0}
  #printArea .sig{display:flex;justify-content:space-between;margin-top:40px}
  #printArea .sig span{border-top:1px solid #000;padding-top:3px;width:42%;text-align:center}
}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<style id="pageStyle"></style>
<div id="printArea"></div>
<script>
/* ===== SETTINGS ===== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyABhCex-ztonzWcT5FNOIkpLuST9OcrgKg",
  authDomain: "raj-bros-marketing.firebaseapp.com",
  projectId: "raj-bros-marketing",
  storageBucket: "raj-bros-marketing.firebasestorage.app",
  messagingSenderId: "599537810394",
  appId: "1:599537810394:web:bd59e49f5a4c0e04b51ee3"
};
const ADMIN_EMAIL = "admin@rajbros.app";
const DOMAIN = "@rajbros.app";

/* ===== PRODUCTS ===== */
const FLAVORS = ["Nextra","Orange","Cream","Cola","Lemon","Ginger"];
const SIZES = [250,500,750,1050,1500];
const ENERGY = ["RED BOOST GOLD 250 ML","RED BOOST ORIGINAL 330ML","RED BOOST SUGAR FREE 330ML","RED BOOST BEAST 330 ML","RASTRO ENERGIX BLUE 330ML","RASTRO ENERGIX RED 330 ML"];
const REASONS = ["Shop refused / not needed","Wrong item delivered","Damaged goods","Price issue","Ordered by mistake","Other"];

/* ===== CATEGORIES (add new ones here) ===== */
const CATS = ["Soda","Red Boost","Match Box"];
const CAT_LABEL = {"Soda":"Soda","Red Boost":"Red Boost / Energy","Match Box":"Match Box"};
const GROUP_LABEL = {"Red Boost":"Red Boost / Energy drinks","Match Box":"Match Box"};
const PFX = {"Soda":"SD/","Red Boost":"RB/","Match Box":"MB/"};       // invoice number prefix
const CK = {"Soda":"s","Red Boost":"b","Match Box":"m"};              // counter field in meta/counter
const HEAD = {"Soda":"RED BEVERAGES PVT (LTD)","Red Boost":"CEYLON ENERGY BEVERAGES (PVT) LTD","Match Box":"MATCH BOX COMPANY NAME"}; // <-- change Match Box company name here
const NAME_HINT = {"Red Boost":"Product name (e.g. RED BOOST MANGO 330ML)","Match Box":"Product name (e.g. Match Box Small 10 pcs)"};

function seed(){
  const p=[];let i=1;
  SIZES.forEach(s=>FLAVORS.forEach(f=>p.push({id:"p"+i++,cat:"Soda",name:f+" "+s+" ml",size:s,stock:0,exf:0,exd:0,mrp:0,bp:0})));
  ENERGY.forEach(n=>p.push({id:"p"+i++,cat:"Red Boost",name:n,size:0,stock:0,exf:0,exd:0,mrp:0,bp:0}));
  return p;
}

/* ===== STATE / HELPERS ===== */
let S={products:[],orders:[],refs:[],offers:[]},user=null,ready=false,unsubs=[],seeded=false,loginErr="";
let tab="order",cart={},freeCart={},newCat="Soda",lastFree="",shopAddr="",shopTel="",DISC={},RET={},shopName="",msg="",lrole="admin",ocat="Soda",osz=250,brep="";
let db,auth,auth2,F;
const $=s=>document.querySelector(s);
const money=n=>"Rs "+(+n||0).toLocaleString("en-US",{maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const bpOf=p=>p.bp>0?p.bp:p.exd;
const prodById=id=>S.products.find(p=>p.id===id);
const catRank=c=>{const i=CATS.indexOf(c);return i<0?1:i;};
function offerMatches(o,p){return o.active!==false&&(o.scope==="size"?(p.cat==="Soda"&&p.size===o.buySize):p.id===o.buyPid);}
function calcFree(c){
  const m={};
  S.offers.forEach(o=>S.products.forEach(p=>{
    const q=c[p.id]||0;
    if(q>0&&q>=o.n&&offerMatches(o,p)){m[o.freePid]=(m[o.freePid]||0)+(o.repeat?Math.floor(q/o.n):1)*o.m;}
  }));
  return m;
}
function allFree(){const m=calcFree(cart);Object.entries(freeCart).forEach(([id,q])=>{if(q>0)m[id]=(m[id]||0)+q;});return m;}
const cOf=p=>CATS.includes(p.cat)?p.cat:"Red Boost";
function calcTotals(cat){
  const L=S.products.filter(p=>cart[p.id]>0&&cOf(p)===cat),gross=sum(L,p=>cart[p.id]*bpOf(p));
  const dv=DISC[cat],rv=RET[cat];
  const dp=Math.min(100,Math.max(0,+dv||0)),less=Math.round(gross*dp)/100,ret=Math.max(0,+rv||0);
  return {L,gross,dp,less,ret,total:Math.max(0,Math.round((gross-less-ret)*100)/100)};
}
const headName=o=>HEAD[o.cat]||HEAD["Soda"];
const invNo=o=>o.inv?((PFX[o.cat]||"RB/")+String(o.inv).padStart(5,"0")):("RB/"+String(o.id).padStart(5,"0"));
function freeName(o){const p=prodById(o.freePid);return p?p.name:"?";}
function offerText(o){
  const b=o.scope==="size"?"any "+o.buySize+" ml soda (each flavor counted separately)":(prodById(o.buyPid)||{name:"?"}).name;
  return "Buy "+o.n+" pcs of "+b+", get "+o.m+" pcs "+freeName(o)+" free"+(o.repeat?" (for every "+o.n+" pcs)":" (once)");
}
function offerHint(p){return S.offers.filter(o=>offerMatches(o,p)).map(o=>`<div class="mute" style="color:var(--ok)">Offer: buy ${o.n}, get ${o.m} ${esc(freeName(o))} free${o.repeat?" (every "+o.n+")":""}</div>`).join("");}
const note=(t,k)=>`<div class="note ${k}">${esc(t)}</div>`;

/* ===== VIEWS ===== */
function loginHTML(){
  return `<div class="card login"><h2 style="margin:0">RAJ BROS MARKETING</h2>
  <div class="seg"><button class="${lrole=="admin"?"on":""}" data-act="role" data-v="admin">Admin</button><button class="${lrole=="rep"?"on":""}" data-act="role" data-v="rep">Rep</button></div>
  ${lrole=="admin"?'<input id="lp" type="password" placeholder="Admin password">':
   '<input id="ln" placeholder="Rep ID" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="username"><input id="lp" type="password" placeholder="Password" autocapitalize="none" autocorrect="off">'}
  <button class="pri" data-act="login">Log in</button><div class="err" id="lerr">${esc(loginErr)}</div></div>`;
}

function statsHTML(){
  const P=S.products,act=S.orders.filter(o=>o.status=="active"),can=S.orders.filter(o=>o.status=="cancelled");
  const cs=c=>sum(P.filter(p=>cOf(p)===c),p=>p.stock);
  const soda=cs("Soda"),en=cs("Red Boost"),mb=cs("Match Box");
  const t0=new Date().setHours(0,0,0,0);
  const c=[["Total stock",(soda+en+mb)+" pcs"],["Soda",soda+" pcs"],["Red Boost",en+" pcs"],["Match Box",mb+" pcs"],
    ["Stock value (ex-factory)",money(sum(P,p=>p.stock*p.exf))],
    ["Sales today",money(sum(act.filter(o=>o.time>=t0),o=>o.total))],
    ["Cancelled bills",can.length],["Lost / damaged",money(sum(can,o=>o.lost||0))]];
  return `<div class="stats">${c.map(([l,v])=>`<div><span>${l}</span><b>${v}</b></div>`).join("")}</div>`;
}

function sodaSizes(){return [...new Set(S.products.filter(p=>p.cat==="Soda").map(p=>p.size))].sort((a,b)=>a-b);}
function addProdHTML(){
  const soda=newCat==="Soda",z=sodaSizes();
  return `<div class="card"><b>Add new product</b><div style="display:grid;gap:8px;margin-top:8px">
  <select data-f="pcat">${CATS.map(c=>`<option value="${c}" ${newCat===c?"selected":""}>${c=="Red Boost"?"Red Boost / Energy drinks":c}</option>`).join("")}</select>
  <input id="pn" placeholder="${soda?"Flavor name (e.g. Grape)":NAME_HINT[newCat]||"Product name"}">
  ${soda?`<select id="pz"><option value="all">All existing sizes</option>${z.map(x=>`<option value="${x}">${x} ml only</option>`).join("")}</select><input id="pz2" type="number" inputmode="numeric" min="1" placeholder="or a new size in ml (e.g. 2000)">`:""}
  <div class="two"><input id="ps" type="number" inputmode="numeric" min="0" placeholder="Opening stock"><input id="pf" type="number" inputmode="decimal" step="0.01" placeholder="Ex Factory"></div>
  <div class="two"><input id="pd" type="number" inputmode="decimal" step="0.01" placeholder="Ex Dealer"><input id="pm" type="number" inputmode="decimal" step="0.01" placeholder="MRP"></div>
  <input id="pb" type="number" inputmode="decimal" step="0.01" placeholder="Bill price (optional)">
  <button class="pri" data-act="addprod">Add product</button></div>
  <div class="mute" style="margin-top:6px">${soda?"A Soda flavor is created for the size(s) you choose, using the same stock and prices. You can edit each one below.":"The product appears in the "+esc(CAT_LABEL[newCat]||newCat)+" list."}</div></div>`;
}

function groupName(p){return p.cat=="Soda"?"Soda "+p.size+" ml":(GROUP_LABEL[p.cat]||"Red Boost / Energy drinks");}

function stockHTML(){
  let h=addProdHTML()+'<p><button class="sm" data-act="csvstock">Download stock (CSV)</button></p><div class="card scroll"><table><thead><tr><th>Product</th><th>Stock</th><th>Add stock</th><th>Ex Factory</th><th>Ex Dealer</th><th>MRP</th><th>Bill price</th><th></th></tr></thead><tbody>',last="";
  S.products.forEach(p=>{
    const g=groupName(p);if(g!==last){h+=`<tr class="grp"><td colspan="8">${g}</td></tr>`;last=g;}
    const cl=p.stock==0?"zero":p.stock<=10?"low":"";
    h+=`<tr><td>${esc(p.name)}</td>
    <td><input type="number" min="0" class="${cl}" data-id="${p.id}" data-f="stock" value="${p.stock}"></td>
    <td><input type="number" min="0" placeholder="+ qty" data-id="${p.id}" data-f="add"></td>
    <td><input type="number" min="0" step="0.01" data-id="${p.id}" data-f="exf" value="${p.exf}"></td>
    <td><input type="number" min="0" step="0.01" data-id="${p.id}" data-f="exd" value="${p.exd}"></td>
    <td><input type="number" min="0" step="0.01" data-id="${p.id}" data-f="mrp" value="${p.mrp}"></td>
    <td><input type="number" min="0" step="0.01" data-id="${p.id}" data-f="bp" value="${p.bp>0?p.bp:p.exd}"></td>
    <td style="white-space:nowrap"><button class="sm" data-act="renprod" data-v="${p.id}">Rename</button> <button class="sm" data-act="delprod" data-v="${p.id}">Delete</button></td></tr>`;
  });
  return h+'</tbody></table></div><p class="mute">Changes save automatically when you leave a field. Bill price is the price used on bills. Red border = out of stock, orange = 10 or fewer left.</p>';
}

function billsHTML(){
  const adm=user.role==="admin",L=S.orders.slice(0,300);
  const top='<p><button class="sm" data-act="csvbills">Download bills (CSV)</button></p>';
  if(!L.length)return top+'<div class="card mute">No bills yet.</div>';
  return top+L.map(o=>`<div class="card bill ${o.status}">
    <div class="row"><b>Bill #${o.id}${o.cat?" ("+o.cat+")":""}</b><span class="badge ${o.status}">${o.status=="active"?"Active":"Cancelled"}</span></div>
    <div class="mute">${new Date(o.time).toLocaleString()}, Rep: ${esc(o.rep)}, Shop: ${esc(o.shop)}</div>
    <ul>${o.items.map(i=>`<li>${esc(i.name)} x ${i.qty} ${i.free?'<b style="color:var(--ok)">FREE</b>':"@ "+money(i.price)+" = "+money(i.qty*i.price)}</li>`).join("")}</ul>
    <div class="row"><b>${money(o.total)}</b><span><button class="sm" data-act="print" data-v="${o.id}">Print invoice</button> <button class="sm" data-act="printr" data-v="${o.id}">Print receipt</button> ${o.status=="active"?`<button class="sm" data-act="cancel" data-v="${o.id}">Cancel bill</button>`:""}</span></div>
    ${(o.less||o.ret)?`<div class="mute">Gross ${money(o.gross)}, Discount ${money(o.less)}, Return ${money(o.ret)}</div>`:""}
    ${o.status=="cancelled"?`<div class="mute">Reason: ${esc(o.reason)}${o.note?" - "+esc(o.note):""}<br>Returned to stock: ${sum(o.items,i=>i.back||0)} pcs. Lost / damaged: ${money(o.lost)}</div>`:""}
  </div>`).join("");
}

function repsHTML(){
  return `<div class="card"><b>Create rep login</b><div style="display:grid;gap:8px;margin-top:8px"><input id="rn" placeholder="Rep name"><input id="ri" placeholder="Rep ID (letters / numbers, used to log in)" autocapitalize="none"><input id="rp" placeholder="Password (min 6 characters)"><input id="rt" type="tel" inputmode="tel" placeholder="Rep phone number (optional)"></div>
  <p><button class="pri" data-act="addrep">Create rep</button></p><div class="mute">A rep can log in only after you create the ID and password here. Reps can change their own password in Settings. Press Remove to block a rep.</div></div>
  ${S.refs.map(r=>`<div class="card row"><span><b>${esc(r.name)}</b><br><span class="mute">ID: ${esc(r.id)}${r.phone?", Tel: "+esc(r.phone):""}</span></span><button class="sm" data-act="repphone" data-v="${esc(r.uid)}">Phone</button> <button class="sm" data-act="delrep" data-v="${esc(r.uid)}">Remove</button></div>`).join("")||'<div class="card mute">No reps yet. Create one above.</div>'}`;
}

function offersHTML(){
  const opt=p=>`<option value="${p.id}">${esc(p.name)}</option>`;
  return `<div class="card" style="display:grid;gap:8px"><b>Create free-soda offer</b>
  <label class="mute">When the bill has</label>
  <select id="ofb"><optgroup label="Each flavor of a size, counted separately">${sodaSizes().map(z=>`<option value="s:${z}">Any ${z} ml soda</option>`).join("")}</optgroup>
  <optgroup label="One product only">${S.products.map(p=>`<option value="p:${p.id}">${esc(p.name)}</option>`).join("")}</optgroup></select>
  <input id="ofn" type="number" inputmode="numeric" min="1" placeholder="Quantity needed (pieces), e.g. 24">
  <label class="mute">Give this free</label>
  <select id="off">${S.products.map(opt).join("")}</select>
  <input id="ofm" type="number" inputmode="numeric" min="1" placeholder="Free quantity (pieces), e.g. 2">
  <label class="row" style="justify-content:flex-start"><input id="ofr" type="checkbox" checked style="width:22px;height:22px"> Repeat for every full quantity (48 pcs gives double)</label>
  <button class="pri" data-act="addoffer">Add offer</button></div>
  ${S.offers.map(o=>`<div class="card row"><span>${esc(offerText(o))}</span><button class="sm" data-act="deloffer" data-v="${o.id}">Delete</button></div>`).join("")||'<div class="card mute">No offers yet.</div>'}`;
}

function settingsHTML(){
  const ph=user.role==="admin"?(S.adminPhone||""):(user.phone||"");
  return `<div class="card" style="display:grid;gap:8px;max-width:360px"><b>My phone number</b><input id="mp" type="tel" inputmode="tel" placeholder="Phone number" value="${esc(ph)}"><button class="pri" data-act="savephone">Save phone</button><div class="mute">This number is printed as Tel next to Sales Person on your bills.</div></div>`+`<div class="card" style="display:grid;gap:8px;max-width:360px"><b>Change my password</b>
  <input id="op" type="password" placeholder="Current password"><input id="np" type="password" placeholder="New password (min 6 characters)"><input id="np2" type="password" placeholder="Repeat new password">
  <button class="pri" data-act="chpass">Save password</button></div>`;
}

function cnt(f){return sum(S.products.filter(f),p=>cart[p.id]||0);}
function chip(act,v,label,n,on){return `<button class="chip ${on?"on":""}" data-act="${act}" data-v="${v}">${label}${n?`<i>${n}</i>`:""}</button>`;}

function sumHTML(){
  const F=Object.entries(allFree()),cats=CATS.map(c=>[c,calcTotals(c)]).filter(([c,T])=>T.L.length);
  if(!cats.length&&!F.length)return '<span class="mute">No items selected yet. Pick a category above and tap +.</span>';
  const R=(a,b,bold)=>`<div class="row" style="margin-top:2px">${bold?"<b>"+a+"</b><b>"+b+"</b>":"<span>"+a+"</span><span>"+b+"</span>"}</div>`;

function listenErr(e){
  if(e.code==="permission-denied"&&user&&user.role==="rep"){auth.signOut();loginErr="Your access was removed. Contact the admin.";return;}
  msg=note("Connection problem: "+e.message,"err");render(true);
}

function startListening(){
  unsubs.push(db.collection("products").onSnapshot(s=>{
    S.products=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(catRank(a.cat)-catRank(b.cat))||((a.size||0)-(b.size||0))||((a.sort||0)-(b.sort||0)));
    if(user.role==="admin"&&s.empty&&!s.metadata.fromCache&&!seeded)seedProducts();
    render();
  },listenErr));
  unsubs.push(db.collection("offers").onSnapshot(s=>{S.offers=s.docs.map(d=>({id:d.id,...d.data()}));render();},listenErr));
  const q=user.role==="admin"?db.collection("orders").orderBy("time","desc").limit(500):db.collection("orders").where("repId","==",user.uid).limit(200);
  unsubs.push(q.onSnapshot(s=>{S.orders=s.docs.map(d=>d.data()).sort((a,b)=>b.time-a.time);render();},listenErr));
  if(user.role==="admin")unsubs.push(db.doc("meta/admin").onSnapshot(d=>{S.adminPhone=d.exists?(d.data().phone||""):"";render();},()=>{}));
  if(user.role==="admin")unsubs.push(db.collection("refs").onSnapshot(s=>{S.refs=s.docs.map(d=>({uid:d.id,...d.data()})).sort((a,b)=>a.name.localeCompare(b.name));render();},listenErr));
}

async function seedProducts(){
  seeded=true;const b=db.batch();
  seed().forEach((p,i)=>b.set(db.doc("products/"+p.id),{...p,sort:i}));
  await b.commit();
}

async function submitOrder(){
  const rr=user.role==="admin"&&brep?S.refs.find(x=>x.uid===brep):null;
  const who=user.role==="admin"?(rr?{id:rr.uid,name:rr.name,tel:rr.phone||""}:{id:"admin",name:"Admin",tel:S.adminPhone||""}):{id:user.uid,name:user.name,tel:user.phone||""};
  const shop=shopName.trim(),lines=Object.entries(cart).filter(([k,v])=>v>0);
  if(!shop){msg=note("Enter the shop name.","err");render(true);return;}
  if(!lines.length){msg=note("Add at least one product quantity.","err");render(true);return;}
  const fr=allFree(),need={};
  lines.forEach(([id,q])=>{need[id]=(need[id]||0)+q;});
  Object.entries(fr).forEach(([id,q])=>{need[id]=(need[id]||0)+q;});
  try{
    const r=await db.runTransaction(async t=>{
      const cref=db.doc("meta/counter"),cs=await t.get(cref);
      const ids=Object.keys(need),P={};
      const snaps=await Promise.all(ids.map(id=>t.get(db.doc("products/"+id))));
      ids.forEach((id,i)=>{P[id]=snaps[i];});
      const bad=[];
      ids.forEach(id=>{
        const p=P[id].exists?P[id].data():null;
        if(!p||p.stock<need[id])bad.push((p?p.name:id)+": only "+(p?p.stock:0)+" in stock, needed "+need[id]+(fr[id]?" (including "+fr[id]+" free)":""));
      });
      if(bad.length)return {bad};
      const items=lines.map(([id,q])=>({pid:id,name:P[id].data().name,qty:q,price:bpOf(P[id].data()),cat:cOf(P[id].data())}));
      Object.entries(fr).forEach(([id,q])=>items.push({pid:id,name:P[id].data().name,qty:q,price:0,free:true,cat:cOf(P[id].data())}));
      ids.forEach(id=>t.update(P[id].ref,{stock:P[id].data().stock-need[id]}));
      const c=cs.exists?cs.data():{};
      let n=c.n||0;const seq={};
      CATS.forEach(cat=>{seq[CK[cat]]=c[CK[cat]]||0;});
      const made=[];
      CATS.forEach(cat=>{
        const its=items.filter(i=>i.cat===cat);if(!its.length)return;
        const gross=sum(its,i=>i.qty*i.price),dv=DISC[cat],rv=RET[cat];
        const dp=Math.min(100,Math.max(0,+dv||0)),less=Math.round(gross*dp)/100,ret=Math.max(0,+rv||0);
        const total=Math.max(0,Math.round((gross-less-ret)*100)/100);
        n++;const inv=++seq[CK[cat]];
        t.set(db.doc("orders/"+n),{id:n,inv,cat,rep:who.name,repId:who.id,repTel:who.tel||"",shop,addr:shopAddr.trim(),tel:shopTel.trim(),time:Date.now(),items:its,gross,discPct:dp,less,ret,total,status:"active"});
        made.push(n);
      });
      t.set(cref,{n,...seq});
      return {ok:made};
    });
    if(r.bad)msg=note("Invalid stock. "+r.bad.join(" | "),"err");
    else{
      msg='<div class="note ok">'+r.ok.map(id=>'Bill #'+id+' saved. <button class="sm" data-act="print" data-v="'+id+'">Print invoice</button> <button class="sm" data-act="printr" data-v="'+id+'">Print receipt</button>').join('<br>')+'</div>';
      cart={};freeCart={};shopName="";shopAddr="";shopTel="";DISC={};RET={};tab="bills";
    }
  }catch(e){msg=note("Could not save the bill: "+e.message,"err");}
  render(true);
}

async function doCancel(id){
  const backs=[...document.querySelectorAll("[data-back]")].map(i=>Math.floor(+i.value||0));
  const reason=$("#cr").value,nt=$("#cn").value.trim();
  try{
    await db.runTransaction(async t=>{
      const oref=db.doc("orders/"+id),os=await t.get(oref);
      if(!os.exists||os.data().status!=="active")return;
      const o=os.data(),back={};
      o.items.forEach((it,i)=>{const b=Math.min(it.qty,Math.max(0,backs[i]||0));it.back=b;back[it.pid]=(back[it.pid]||0)+b;});
      const ids=Object.keys(back);
      const ps=await Promise.all(ids.map(pid=>t.get(db.doc("products/"+pid))));
      ps.forEach((sn,i)=>{if(sn.exists&&back[ids[i]]>0)t.update(sn.ref,{stock:sn.data().stock+back[ids[i]]});});
      t.update(oref,{status:"cancelled",reason,note:nt,by:user.role==="admin"?"Admin":user.name,items:o.items,lost:sum(o.items,i=>(i.qty-i.back)*i.price)});
    });
    msg=note("Bill #"+id+" cancelled. Stock updated.","ok");
  }catch(e){msg=note("Could not cancel: "+e.message,"err");}
  $("#dlg").close();render(true);
}

async function addProduct(){
  const cat=newCat,name=$("#pn").value.trim();
  if(!name){msg=note("Enter the product name.","err");render(true);return;}
  const base={stock:Math.max(0,Math.floor(+$("#ps").value||0)),exf:+$("#pf").value||0,exd:+$("#pd").value||0,mrp:+$("#pm").value||0,bp:+$("#pb").value||0};
  let list=[];
  if(cat==="Soda"){
    const ns=Math.floor(+$("#pz2").value||0),sel=$("#pz").value;
    const sizes=ns>0?[ns]:(sel==="all"?sodaSizes():[+sel]);
    if(!sizes.length){msg=note("Enter a size in ml.","err");render(true);return;}
    sizes.forEach(z=>list.push({cat:"Soda",size:z,name:name+" "+z+" ml"}));
  }else list.push({cat:cat,size:0,name});
  const have=new Set(S.products.map(p=>p.name.toLowerCase()));
  const dup=list.filter(x=>have.has(x.name.toLowerCase())).map(x=>x.name);
  list=list.filter(x=>!have.has(x.name.toLowerCase()));
  if(!list.length){msg=note("Already exists: "+dup.join(", "),"err");render(true);return;}
  try{
    const b=db.batch(),t0=Date.now();
    list.forEach((x,i)=>{const id="n"+t0.toString(36)+i;b.set(db.doc("products/"+id),{...base,...x,id,sort:t0+i});});
    await b.commit();
    msg=note("Added "+list.length+" product(s)."+(dup.length?" Skipped (already exist): "+dup.join(", "):""),"ok");
  }catch(e){msg=note("Could not add: "+e.message,"err");}
  render(true);
}

async function addOffer(){
  const sc=$("#ofb").value,n=Math.floor(+$("#ofn").value),fp=$("#off").value,m=Math.floor(+$("#ofm").value),rep=$("#ofr").checked;
  if(!(n>0)||!(m>0)||!fp){msg=note("Enter the quantity needed, the free product and the free quantity.","err");render(true);return;}

  try{await db.collection("offers").add(o);msg=note("Offer added.","ok");}catch(e){msg=note(e.message,"err");}
  render(true);
}

async function addRep(){
  const n=$("#rn").value.trim(),id=$("#ri").value.trim().toLowerCase(),p=$("#rp").value.trim(),ph=$("#rt").value.trim();
  if(!n||!id||!p){msg=note("Enter the rep name, ID and password.","err");render(true);return;}
  if(!/^[a-z0-9._-]+$/.test(id)){msg=note("Rep ID can use only letters, numbers, dot, dash and underscore (no spaces).","err");render(true);return;}
  if(p.length<6){msg=note("Password must be at least 6 characters.","err");render(true);return;}
  try{
    let uid;
    try{uid=(await auth2.createUserWithEmailAndPassword(id+DOMAIN,p)).user.uid;}
    catch(e){
      if(e.code!=="auth/email-already-in-use")throw e;
      try{uid=(await auth2.signInWithEmailAndPassword(id+DOMAIN,p)).user.uid;}
      catch(e2){throw new Error("That Rep ID already exists with a different password. Use a new Rep ID.");}
    }
    await db.doc("refs/"+uid).set({id,name:n,phone:ph});
    msg=note("Rep "+n+" is ready. Login ID: "+id,"ok");
  }catch(e){msg=note(e.message,"err");}
  try{await auth2.signOut();}catch(e){}

async function changePass(){
  const o=$("#op").value,n=$("#np").value.trim(),n2=$("#np2").value.trim();
  if(n.length<6){msg=note("New password must be at least 6 characters.","err");render(true);return;}

  <div style="display:flex;justify-content:space-between;gap:16px">
    <div style="width:45%">${L("No Items :",G.length)}${L("Free Issue Items :",sum(G,k=>k.f))}</div>
    <div style="width:55%">${L("Gross Total",fmt(gross))}${L("Return Amount",fmt(o.ret||0))}${L("Total Discount %",fmt(o.discPct||0))}${L("Less Discount",fmt(o.less||0))}<div style="border-top:2px solid #000;margin-top:4px;padding-top:3px;font-weight:bold;font-size:15px">${L("Total Value","Rs "+fmt(o.total))}</div></div>
  </div>
  <div class="c" style="margin-top:8px">This is an autogenerated invoice.</div>
  <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-top:14px">
    <div style="width:48%;border:1px solid #000;padding:4px"><div>Customer Acknowledgement</div><div style="display:flex;justify-content:space-between;margin:4px 0"><span>Date</span><span>Month</span><span>Year</span></div><div style="height:34px"></div><div style="border-top:1px solid #000;padding-top:2px">Customer Signature</div></div>
    <div style="width:48%;text-align:center;font-weight:bold">PLEASE DON'T MAKE ANY PAYMENT WITHOUT THE ORIGINAL INVOICE</div>
  </div>`;
  const rc=style==="receipt";
  if(rc)html=receiptHTML(o,G,gross);
  $("#printArea").className=rc?"rcpt":"inv";
  $("#pageStyle").textContent=rc?"@page{size:80mm auto;margin:0}":"@page{size:A5;margin:0}";
  $("#printArea").innerHTML=html;
  setTimeout(()=>window.print(),80);
}

function csv(name,rows){
  const t=rows.map(r=>r.map(c=>'"'+String(c==null?"":c).replace(/"/g,'""')+'"').join(",")).join("\r\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob(["\ufeff"+t],{type:"text/csv"}));
  a.download=name+"-"+new Date().toISOString().slice(0,10)+".csv";
  document.body.appendChild(a);a.click();a.remove();
}

/* ===== EVENTS ===== */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act,v=b.dataset.v;
  if(a=="role"){lrole=v;loginErr="";render(true);}
  else if(a=="login")login();
  else if(a=="tab"){tab=v;msg="";render(true);}
  else if(a=="logout"){msg="";cart={};freeCart={};auth.signOut();}
  else if(a=="submit")submitOrder();
  else if(a=="cancel")openCancel(+v);
  else if(a=="docancel")doCancel(+v);
  else if(a=="close")$("#dlg").close();
  else if(a=="addrep")addRep();
  else if(a=="delrep"){if(confirm("Remove this rep? They will not be able to log in."))db.doc("refs/"+v).delete().catch(x=>{msg=note(x.message,"err");render(true);});}
  else if(a=="chpass")changePass();
  else if(a=="addoffer")addOffer();
  else if(a=="print")printBill(+v,"invoice");
  else if(a=="printr")printBill(+v,"receipt");
  else if(a=="addprod")addProduct();
  else if(a=="delprod"){const p=prodById(v);if(p&&confirm("Delete "+p.name+"? Old bills keep their record."))db.doc("products/"+v).delete().catch(x=>{msg=note(x.message,"err");render(true);});}
  else if(a=="renprod"){const p=prodById(v),n=p&&prompt("New name:",p.name);if(n&&n.trim())db.doc("products/"+v).update({name:n.trim()}).catch(x=>{msg=note(x.message,"err");render(true);});}
  else if(a=="savephone"){const p=$("#mp").value.trim();
    const w=user.role==="admin"?db.doc("meta/admin").set({phone:p}):db.doc("refs/"+user.uid).update({phone:p});
    w.then(()=>{if(user.role!=="admin")user.phone=p;msg=note("Phone number saved.","ok");render(true);}).catch(x=>{msg=note("Could not save: "+x.message,"err");render(true);});}
  else if(a=="repphone"){const r0=S.refs.find(x=>x.uid===v),p=prompt("Phone number for "+(r0?r0.name:"rep")+":",r0&&r0.phone||"");
    if(p!==null)db.doc("refs/"+v).update({phone:p.trim()}).catch(x=>{msg=note(x.message,"err");render(true);});}
  else if(a=="addfree"){const id=$("#fsel").value,q=Math.floor(+$("#fqty").value);if(!(q>0)){msg=note("Enter the free quantity.","err");render(true);return;}freeCart[id]=(freeCart[id]||0)+q;lastFree=id;msg="";const y=scrollY;render(true);scrollTo(0,y);}
  else if(a=="rmfree"){delete freeCart[v];const y=scrollY;render(true);scrollTo(0,y);}
  else if(a=="deloffer"){if(confirm("Delete this offer?"))db.doc("offers/"+v).delete().catch(x=>{msg=note(x.message,"err");render(true);});}
  else if(a=="ocat"){ocat=v;render(true);}
  else if(a=="osz"){osz=+v;render(true);}
  else if(a=="inc"||a=="dec"){const y=scrollY;cart[v]=Math.max(0,(cart[v]||0)+(a=="inc"?1:-1));render(true);scrollTo(0,y);}
  else if(a=="csvstock")csv("stock",[["Category","Product","Stock","Ex Factory","Ex Dealer","MRP","Bill price"]].concat(S.products.map(p=>[p.cat,p.name,p.stock,p.exf,p.exd,p.mrp,bpOf(p)])));
  else if(a=="csvbills")csv("bills",[["Bill","Date","Rep","Shop","Status","Items","Total","Reason","Note","Returned pcs","Lost / damaged value","Category"]].concat(S.orders.map(o=>[o.id,new Date(o.time).toLocaleString(),o.rep,o.shop,o.status,o.items.map(i=>i.name+" x"+i.qty+(i.free?" (FREE)":" @ "+i.price+" = "+(i.qty*i.price))).join("; "),o.total,o.reason||"",o.note||"",o.status=="cancelled"?sum(o.items,i=>i.back||0):"",o.lost||"",o.cat||""])));
});

document.addEventListener("change",e=>{
  const t=e.target,id=t.dataset.id,f=t.dataset.f;
  if(!id||!["stock","add","exf","exd","mrp","bp"].includes(f))return;
  const v=Math.max(0,+t.value||0),ref=db.doc("products/"+id);
  const upd=f=="add"?{stock:F.increment(Math.floor(v))}:f=="stock"?{stock:Math.floor(v)}:{[f]:v};
  ref.update(upd).then(()=>{if(f=="add")t.value="";}).catch(x=>{msg=note("Could not save: "+x.message,"err");render(true);});
});

document.addEventListener("input",e=>{
  const t=e.target,f=t.dataset.f;
  if(f=="shop")shopName=t.value;
  if(f=="brep")brep=t.value;
  if(f=="fsel")lastFree=t.value;
  if(f=="pcat"){newCat=t.value;render(true);}
  if(f=="addr")shopAddr=t.value;
  if(f=="tel")shopTel=t.value;
  if(f=="disc"||f=="ret"){(f=="disc"?DISC:RET)[t.dataset.c]=t.value;updateTot();const sm=$("#sum");if(sm)sm.innerHTML=sumHTML();}
  if(f=="qty"){
    const q=Math.max(0,Math.floor(+t.value||0)),p=S.products.find(x=>x.id===t.dataset.id);
    cart[t.dataset.id]=q;t.classList.toggle("over",!!p&&q>p.stock);updateTot();
    const sm=$("#sum");if(sm)sm.innerHTML=sumHTML();
  }
});

/* ===== START ===== */
if(FIREBASE_CONFIG){
  firebase.initializeApp(FIREBASE_CONFIG);
  db=firebase.firestore();auth=firebase.auth();F=firebase.firestore.FieldValue;
  auth2=firebase.initializeApp(FIREBASE_CONFIG,"creator").auth();
  auth.onAuthStateChanged(async u=>{
    unsubs.forEach(f=>f());unsubs=[];user=null;S={products:[],orders:[],refs:[],offers:[]};
    if(u){
      if(u.email===ADMIN_EMAIL)user={role:"admin",uid:u.uid};
      else{
        try{
          const d=await db.doc("refs/"+u.uid).get();
          if(d.exists)user={role:"rep",uid:u.uid,id:d.data().id,name:d.data().name,phone:d.data().phone||""};
          else{loginErr="This login has been removed by the admin.";await auth.signOut();}
        }catch(e){loginErr="Could not load your account. Check your internet.";await auth.signOut();}
      }
    }
    ready=true;
    if(user){tab="order";startListening();}
    render(true);
  });
}
render(true);
</script>
