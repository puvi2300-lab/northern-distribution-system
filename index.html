<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c8321e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RAJ BROS">
<title>RAJ BROS MARKETING</title>
<style>
:root{--bg:#f3f5f4;--card:#fff;--ink:#16201f;--mute:#5d6b69;--line:#dbe3e1;--acc:#c8321e;--ok:#17803d;--warn:#b45309}
@media(prefers-color-scheme:dark){:root{--bg:#111716;--card:#1a2321;--ink:#eaf0ee;--mute:#9aaaa7;--line:#2b3735;--acc:#ef5a43;--ok:#4ade80;--warn:#fbbf24}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
#app{max-width:980px;margin:0 auto;padding:0 12px 90px}
header{padding-top:calc(12px + env(safe-area-inset-top,0px))!important;display:flex;align-items:center;gap:10px;padding:12px 0}
header b{font-size:18px;flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}
.mute{color:var(--mute);font-size:13px}
.stats{display:flex;gap:8px;overflow-x:auto;position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0}
.stats div{flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:8px;padding:6px 12px}
.stats span{display:block;font-size:12px;color:var(--mute)}
.stats b{font-size:17px}
nav{display:flex;gap:6px;margin:8px 0}
button{font:inherit;min-height:38px;touch-action:manipulation;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 14px}
button.on,button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.sm{padding:4px 10px;font-size:13px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
input,select{font:inherit;font-size:16px;-webkit-appearance:none;appearance:none;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 8px;width:100%}
td input{width:86px}
select{background-image:none}
td:first-child,th:first-child{position:sticky;left:0;background:var(--card);z-index:1}
tr.grp td:first-child{background:var(--bg)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
@media(max-width:600px){#app{padding:0 8px 100px}td:first-child{min-width:130px;font-size:14px}}
th,td{padding:5px 6px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:13px;color:var(--mute)}
tr.grp td{background:var(--bg);font-weight:600;padding:8px 6px}
input.low{border-color:var(--warn);color:var(--warn)}
input.zero,input.over{border-color:var(--acc);color:var(--acc)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bill ul{margin:6px 0;padding-left:18px}
.bill.cancelled{opacity:.85;border-left:4px solid var(--acc)}
.bill.active{border-left:4px solid var(--ok)}
.badge{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line)}
.badge.active{color:var(--ok)}.badge.cancelled{color:var(--acc)}
.note{padding:10px 12px;border-radius:8px;margin:10px 0}
.note.err{background:rgba(200,50,30,.12);color:var(--acc)}
.note.ok{background:rgba(23,128,61,.14);color:var(--ok)}
.login{max-width:360px;margin:12vh auto;display:grid;gap:10px}
.seg{display:flex;gap:6px}.seg button{flex:1}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.bar div{max-width:980px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:min(440px,94vw)}
dialog label{display:block;margin:8px 0 3px;font-size:13px;color:var(--mute)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chip{border-radius:99px;padding:7px 14px;position:relative}
.chip i{font-style:normal;font-size:12px;background:var(--ok);color:#fff;border-radius:99px;padding:1px 7px;margin-left:6px}
.chip.on i{background:#fff;color:var(--acc)}
.prod{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.prod:last-child{border-bottom:0}
.step{display:flex;align-items:center;gap:6px}
.step button{width:42px;padding:0;font-size:20px}
.step input{width:64px;text-align:center}
.step input.over{border-color:var(--acc);color:var(--acc)}
.sel{margin:0;padding-left:18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.err{color:var(--acc)}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<script>
/* ===== SETTINGS ===== */
// Paste your Firebase web config here to share data live between admin and reps.
// Leave as null to run in demo mode (data stays only in this browser).
const FIREBASE_CONFIG = null;
/* e.g. {apiKey:"...",authDomain:"...",projectId:"...",appId:"..."} */
const ADMIN_PASS = "admin123"; // first-time password only. Admin can change it inside the app (Settings tab).

/* ===== PRODUCTS ===== */
const FLAVORS = ["Nextra","Orange","Cream","Cola","Lemon","Ginger"];
const SIZES = [250,500,750,1050,1500];
const ENERGY = ["RED BOOST GOLD 250 ML","RED BOOST ORIGINAL 330ML","RED BOOST SUGAR FREE 330ML","RED BOOST BEAST 330 ML","RASTRO ENERGIX BLUE 330ML","RASTRO ENERGIX RED 330 ML"];
const REASONS = ["Shop refused / not needed","Wrong item delivered","Damaged goods","Price issue","Ordered by mistake","Other"];

function seed(){
  const p=[];let i=1;
  SIZES.forEach(s=>FLAVORS.forEach(f=>p.push({id:"p"+i++,cat:"Soda",name:f+" "+s+" ml",size:s,stock:0,exf:0,exd:0,mrp:0,bp:0})));
  ENERGY.forEach(n=>p.push({id:"p"+i++,cat:"Red Boost",name:n,size:0,stock:0,exf:0,exd:0,mrp:0,bp:0}));
  return {products:p,orders:[],refs:[],seq:0};
}

/* ===== STORAGE (Firebase or local demo) ===== */
const KEY="sodaState", subs=[];
let backend;
if(FIREBASE_CONFIG){
  firebase.initializeApp(FIREBASE_CONFIG);
  const fs=firebase.firestore(), ref=fs.doc("app/state");
  backend={
    sub(cb){ref.onSnapshot(s=>{ if(!s.exists) ref.set(seed()); else cb(s.data()); });},
    mut(fn){return fs.runTransaction(async t=>{const s=await t.get(ref);const d=s.exists?s.data():seed();const r=fn(d);t.set(ref,d);return r;});}
  };
}else{
  const load=()=>JSON.parse(localStorage.getItem(KEY)||"null")||seed();
  backend={
    sub(cb){subs.push(cb);cb(load());addEventListener("storage",()=>cb(load()));},
    mut(fn){const d=load();const r=fn(d);localStorage.setItem(KEY,JSON.stringify(d));subs.forEach(cb=>cb(d));return Promise.resolve(r);}
  };
}

/* ===== STATE / HELPERS ===== */
let S=null,user=null,tab="",cart={},shopName="",msg="",lrole="admin",ocat="Soda",osz=250,brep="";
try{user=JSON.parse(sessionStorage.getItem("u")||"null");}catch(e){}
if(user)tab="order";
const $=s=>document.querySelector(s);
const money=n=>"Rs "+(+n||0).toLocaleString("en-US",{maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const bpOf=p=>p.bp>0?p.bp:p.exd;
const note=(t,k)=>`<div class="note ${k}">${esc(t)}</div>`;

/* ===== VIEWS ===== */
function loginHTML(){
  return `<div class="card login"><h2 style="margin:0">RAJ BROS MARKETING</h2>
  <div class="seg"><button class="${lrole=="admin"?"on":""}" data-act="role" data-v="admin">Admin</button><button class="${lrole=="rep"?"on":""}" data-act="role" data-v="rep">Rep</button></div>
  ${lrole=="admin"?'<input id="lp" type="password" placeholder="Admin password">':
   `<input id="ln" placeholder="Rep ID" autocapitalize="none" autocomplete="username"><input id="lp" type="password" placeholder="Password">`}
  <button class="pri" data-act="login">Log in</button><div class="err" id="lerr"></div></div>`;
}

function statsHTML(){
  const P=S.products,act=S.orders.filter(o=>o.status=="active"),can=S.orders.filter(o=>o.status=="cancelled");
  const soda=sum(P.filter(p=>p.cat=="Soda"),p=>p.stock),en=sum(P.filter(p=>p.cat!="Soda"),p=>p.stock);
  const t0=new Date().setHours(0,0,0,0);
  const c=[["Total stock",(soda+en)+" pcs"],["Soda",soda+" pcs"],["Red Boost",en+" pcs"],
    ["Stock value (ex-factory)",money(sum(P,p=>p.stock*p.exf))],
    ["Sales today",money(sum(act.filter(o=>o.time>=t0),o=>o.total))],
    ["Cancelled bills",can.length],["Lost / damaged",money(sum(can,o=>o.lost||0))]];
  return `<div class="stats">${c.map(([l,v])=>`<div><span>${l}</span><b>${v}</b></div>`).join("")}</div>`;
}

function groupName(p){return p.cat=="Soda"?"Soda "+p.size+" ml":"Red Boost / Energy drinks";}

function stockHTML(){
  let h='<div class="card scroll"><table><thead><tr><th>Product</th><th>Stock</th><th>Add stock</th><th>Ex Factory</th><th>Ex Dealer</th><th>MRP</th><th>Bill price</th></tr></thead><tbody>',last="";
  S.products.forEach(p=>{
    const g=groupName(p);if(g!==last){h+=`<tr class="grp"><td colspan="7">${g}</td></tr>`;last=g;}
    const cl=p.stock==0?"zero":p.stock<=10?"low":"";
    h+=`<tr><td>${esc(p.name)}</td>
    <td><input type="number" min="0" class="${cl}" data-id="${p.id}" data-f="stock" value="${p.stock}"></td>
    <td><input type="number" min="0" placeholder="+ qty" data-id="${p.id}" data-f="add"></td>
    <td><input type="number" min="0" step="0.01" data-id="${p.id}" data-f="exf" value="${p.exf}"></td>
    <td><input type="number" min="0" step="0.01" data-id="${p.id}" data-f="exd" value="${p.exd}"></td>
    <td><input type="number" min="0" step="0.01" data-id="${p.id}" data-f="mrp" value="${p.mrp}"></td>
    <td><input type="number" min="0" step="0.01" data-id="${p.id}" data-f="bp" value="${p.bp>0?p.bp:p.exd}"></td></tr>`;
  });
  return h+'</tbody></table></div><p class="mute">Changes save automatically when you leave a field. Bill price is the price used on rep bills (set by admin). Red border = out of stock, orange = 10 or fewer left.</p>';
}

function billsHTML(){
  const adm=user.role==="admin",L=S.orders.filter(o=>adm||o.repId===user.id).slice(0,200);
  if(!L.length)return '<div class="card mute">No bills yet.</div>';
  return L.map(o=>`<div class="card bill ${o.status}">
    <div class="row"><b>Bill #${o.id}</b><span class="badge ${o.status}">${o.status=="active"?"Active":"Cancelled"}</span></div>
    <div class="mute">${new Date(o.time).toLocaleString()}, Rep: ${esc(o.rep)}, Shop: ${esc(o.shop)}</div>
    <ul>${o.items.map(i=>`<li>${esc(i.name)} x ${i.qty} @ ${money(i.price)}</li>`).join("")}</ul>
    <div class="row"><b>${money(o.total)}</b>${o.status=="active"?`<button class="sm" data-act="cancel" data-v="${o.id}">Cancel bill</button>`:""}</div>
    ${o.status=="cancelled"?`<div class="mute">Reason: ${esc(o.reason)}${o.note?" - "+esc(o.note):""}<br>Returned to stock: ${sum(o.items,i=>i.back||0)} pcs. Lost / damaged: ${money(o.lost)}</div>`:""}
  </div>`).join("");
}

function repsHTML(){
  return `<div class="card"><b>Create rep login</b><div style="display:grid;gap:8px;margin-top:8px"><input id="rn" placeholder="Rep name"><input id="ri" placeholder="Rep ID (used to log in)" autocapitalize="none"><input id="rp" placeholder="Password"></div>
  <p><button class="pri" data-act="addrep">Create rep</button></p><div class="mute">A rep can log in only after you create the ID and password here.</div></div>
  ${S.refs.map(r=>`<div class="card"><div class="row"><b>${esc(r.name)}</b><span><button class="sm" data-act="resetrep" data-v="${esc(r.id)}">Change password</button> <button class="sm" data-act="delrep" data-v="${esc(r.id)}">Remove</button></span></div><div class="mute">ID: ${esc(r.id)}, Password: ${esc(r.pass)}</div></div>`).join("")||'<div class="card mute">No reps yet. Create one above.</div>'}`;
}

function settingsHTML(){
  return `<div class="card" style="display:grid;gap:8px;max-width:360px"><b>Change admin password</b>
  <input id="op" type="password" placeholder="Current password"><input id="np" type="password" placeholder="New password (min 6 characters)"><input id="np2" type="password" placeholder="Repeat new password">
  <button class="pri" data-act="chpass">Save password</button></div>`;
}

function cnt(f){return sum(S.products.filter(f),p=>cart[p.id]||0);}
function chip(act,v,label,n,on){return `<button class="chip ${on?"on":""}" data-act="${act}" data-v="${v}">${label}${n?`<i>${n}</i>`:""}</button>`;}

function sumHTML(){
  const L=S.products.filter(p=>cart[p.id]>0);
  if(!L.length)return '<span class="mute">No items selected yet. Pick a category above and tap +.</span>';
  return '<b>Selected items</b><ul class="sel">'+L.map(p=>`<li>${esc(p.name)} x ${cart[p.id]} = ${money(cart[p.id]*bpOf(p))}</li>`).join("")+'</ul>';
}

function orderHTML(){
  const adm=user.role==="admin";
  const list=S.products.filter(p=>ocat=="Soda"?(p.cat=="Soda"&&p.size==osz):p.cat!="Soda");
  let h=`<div class="card"><div style="display:grid;gap:8px"><input id="shop" data-f="shop" placeholder="Shop name" value="${esc(shopName)}">
  ${adm?`<select data-f="brep"><option value="">Bill by: Admin</option>${S.refs.map(r=>`<option value="${esc(r.id)}" ${brep==r.id?"selected":""}>Bill for rep: ${esc(r.name)}</option>`).join("")}</select>`:""}</div>
  <div class="chips">${chip("ocat","Soda","Soda",cnt(p=>p.cat=="Soda"),ocat=="Soda")}${chip("ocat","Red Boost","Red Boost / Energy",cnt(p=>p.cat!="Soda"),ocat!="Soda")}</div>`;
  if(ocat=="Soda")h+=`<div class="chips">${SIZES.map(z=>chip("osz",z,z+" ml",cnt(p=>p.cat=="Soda"&&p.size==z),osz==z)).join("")}</div>`;
  h+='</div><div class="card">';
  list.forEach(p=>{
    const q=cart[p.id]||0;
    h+=`<div class="prod"><div><b>${esc(p.name)}</b><div class="mute">${p.stock>0?"In stock: "+p.stock:"Out of stock"}, ${money(bpOf(p))} each</div></div>
    <div class="step"><button data-act="dec" data-v="${p.id}" ${q?"":"disabled"}>-</button>
    <input type="number" inputmode="numeric" min="0" data-id="${p.id}" data-f="qty" value="${q||""}" placeholder="0" class="${q>p.stock?"over":""}">
    <button data-act="inc" data-v="${p.id}" ${p.stock>0?"":"disabled"}>+</button></div></div>`;
  });
  return h+`</div><div class="card" id="sum">${sumHTML()}</div><div class="bar"><div><span id="tot"></span><button class="pri" data-act="submit">Save bill</button></div></div>`;
}

function updateTot(){
  const el=$("#tot");if(!el)return;
  let n=0,t=0;S.products.forEach(p=>{const q=cart[p.id]||0;if(q>0){n+=q;t+=q*bpOf(p);}});
  el.innerHTML=`<b>${money(t)}</b> <span class="mute">${n} pcs</span>`;
}

function render(force){
  if(!S)return;
  const ae=document.activeElement;
  if(!force&&ae&&/INPUT|SELECT|TEXTAREA/.test(ae.tagName)&&$("#app").contains(ae))return;
  const app=$("#app");
  if(!user){app.innerHTML=loginHTML();return;}
  const adm=user.role==="admin";
  const tabs=adm?[["order","New bill"],["stock","Stock"],["bills","Bills"],["reps","Reps"],["settings","Settings"]]:[["order","New order"],["bills","My bills"]];
  app.innerHTML=`<header><b>RAJ BROS MARKETING</b><span class="mute">${adm?"Admin":esc(user.name)}</span><button class="sm" data-act="logout">Log out</button></header>`
   +(adm?statsHTML():"")
   +`<nav>${tabs.map(([k,l])=>`<button class="${tab===k?"on":""}" data-act="tab" data-v="${k}">${l}</button>`).join("")}</nav>`
   +msg
   +(tab=="stock"?stockHTML():tab=="bills"?billsHTML():tab=="reps"?repsHTML():tab=="settings"?settingsHTML():orderHTML());
  updateTot();
}

/* ===== ACTIONS ===== */
function login(){
  const pw=$("#lp").value;
  if(lrole=="admin"){
    if(pw!==(S.adminPass||ADMIN_PASS)){$("#lerr").textContent="Wrong password.";return;}
    user={role:"admin"};tab="order";
  }else{
    const n=$("#ln").value.trim().toLowerCase(),r=S.refs.find(x=>x.id===n&&x.pass===pw);
    if(!r){$("#lerr").textContent="Wrong Rep ID or password. Ask the admin to create your login.";return;}
    user={role:"rep",id:r.id,name:r.name};tab="order";
  }
  try{sessionStorage.setItem("u",JSON.stringify(user));}catch(e){}
  msg="";render(true);
}

async function submitOrder(){
  const rr=user.role==="admin"&&brep?S.refs.find(x=>x.id===brep):null;
  const who=user.role==="admin"?(rr?{id:rr.id,name:rr.name}:{id:"admin",name:"Admin"}):{id:user.id,name:user.name};
  const shop=shopName.trim(),lines=Object.entries(cart).filter(([k,v])=>v>0);
  if(!shop){msg=note("Enter the shop name.","err");render(true);return;}
  if(!lines.length){msg=note("Add at least one product quantity.","err");render(true);return;}
  const r=await backend.mut(d=>{
    const bad=[],items=[];
    lines.forEach(([id,q])=>{
      const p=d.products.find(x=>x.id===id);
      if(!p||p.stock<q)bad.push((p?p.name:id)+": only "+(p?p.stock:0)+" in stock, you ordered "+q);
      else items.push({pid:id,name:p.name,qty:q,price:bpOf(p)});
    });
    if(bad.length)return {bad};
    items.forEach(i=>{d.products.find(x=>x.id===i.pid).stock-=i.qty;});
    const o={id:++d.seq,rep:who.name,repId:who.id,shop,time:Date.now(),items,total:sum(items,i=>i.qty*i.price),status:"active"};
    d.orders.unshift(o);return {ok:o.id};
  });
  if(r.bad){msg=note("Invalid stock. "+r.bad.join(" | "),"err");}
  else{msg=note("Bill #"+r.ok+" saved.","ok");cart={};shopName="";tab="bills";}
  render(true);
}

function openCancel(id){
  const o=S.orders.find(x=>x.id===id);if(!o)return;
  $("#dlg").innerHTML=`<h3 style="margin-top:0">Cancel bill #${o.id}</h3>
  <label>Reason</label><select id="cr">${REASONS.map(r=>`<option>${r}</option>`).join("")}</select>
  <label>Note (optional)</label><input id="cn">
  <label>How many pieces came back in good condition? The rest count as lost / damaged.</label>
  ${o.items.map((it,i)=>`<div class="row" style="margin:4px 0"><span>${esc(it.name)} (billed ${it.qty})</span><input type="number" min="0" max="${it.qty}" value="${it.qty}" data-back="${i}" style="width:80px"></div>`).join("")}
  <div class="row" style="margin-top:12px"><button data-act="close">Keep bill</button><button class="pri" data-act="docancel" data-v="${o.id}">Cancel bill</button></div>`;
  $("#dlg").showModal();
}

async function doCancel(id){
  const backs=[...document.querySelectorAll("[data-back]")].map(i=>Math.floor(+i.value||0));
  const reason=$("#cr").value,nt=$("#cn").value.trim();
  await backend.mut(d=>{
    const o=d.orders.find(x=>x.id===id);if(!o||o.status!=="active")return;
    o.items.forEach((it,i)=>{
      const b=Math.min(it.qty,Math.max(0,backs[i]||0));it.back=b;
      const p=d.products.find(x=>x.id===it.pid);if(p)p.stock+=b;
    });
    o.status="cancelled";o.reason=reason;o.note=nt;o.by=user.role==="admin"?"Admin":user.name;
    o.lost=sum(o.items,i=>(i.qty-i.back)*i.price);
  });
  $("#dlg").close();msg=note("Bill #"+id+" cancelled. Stock updated.","ok");render(true);
}

async function addRep(){
  const n=$("#rn").value.trim(),id=$("#ri").value.trim().toLowerCase(),p=$("#rp").value.trim();
  if(!n||!id||!p){msg=note("Enter the rep name, ID and password.","err");render(true);return;}
  const ok=await backend.mut(d=>{if(d.refs.some(r=>r.id===id))return false;d.refs.push({id,name:n,pass:p});return true;});
  msg=ok?note("Rep "+n+" created. They can log in now with ID "+id+".","ok"):note("That Rep ID already exists. Use a different ID.","err");render(true);
}

async function changePass(){
  const o=$("#op").value,n=$("#np").value,n2=$("#np2").value;
  if(n.length<6){msg=note("New password must be at least 6 characters.","err");render(true);return;}
  if(n!==n2){msg=note("The two new passwords do not match.","err");render(true);return;}
  const ok=await backend.mut(d=>{if(o!==(d.adminPass||ADMIN_PASS))return false;d.adminPass=n;return true;});
  msg=ok?note("Admin password changed.","ok"):note("Current password is wrong.","err");render(true);
}

/* ===== EVENTS ===== */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act,v=b.dataset.v;
  if(a=="role"){lrole=v;render(true);}
  else if(a=="login")login();
  else if(a=="tab"){tab=v;msg="";render(true);}
  else if(a=="logout"){user=null;try{sessionStorage.removeItem("u");}catch(x){}render(true);}
  else if(a=="submit")submitOrder();
  else if(a=="cancel")openCancel(+v);
  else if(a=="docancel")doCancel(+v);
  else if(a=="close")$("#dlg").close();
  else if(a=="addrep")addRep();
  else if(a=="delrep"){if(confirm("Remove this rep? They will not be able to log in."))backend.mut(d=>{d.refs=d.refs.filter(r=>r.id!==v);}).then(()=>render(true));}
  else if(a=="resetrep"){const p=prompt("New password for this rep:");if(p&&p.trim())backend.mut(d=>{const x=d.refs.find(r=>r.id===v);if(x)x.pass=p.trim();}).then(()=>{msg=note("Password changed.","ok");render(true);});}
  else if(a=="chpass")changePass();
  else if(a=="ocat"){ocat=v;render(true);}
  else if(a=="osz"){osz=+v;render(true);}
  else if(a=="inc"||a=="dec"){const y=scrollY;cart[v]=Math.max(0,(cart[v]||0)+(a=="inc"?1:-1));render(true);scrollTo(0,y);}
});

document.addEventListener("change",e=>{
  const t=e.target,id=t.dataset.id,f=t.dataset.f;
  if(!id||!["stock","add","exf","exd","mrp","bp"].includes(f))return;
  const v=Math.max(0,+t.value||0);
  backend.mut(d=>{
    const p=d.products.find(x=>x.id===id);if(!p)return;
    if(f=="add")p.stock+=Math.floor(v);else if(f=="stock")p.stock=Math.floor(v);else p[f]=v;
  }).then(()=>render(true));
});

document.addEventListener("input",e=>{
  const t=e.target,f=t.dataset.f;
  if(f=="shop")shopName=t.value;
  if(f=="brep")brep=t.value;
  if(f=="qty"){
    const q=Math.max(0,Math.floor(+t.value||0)),p=S.products.find(x=>x.id===t.dataset.id);
    cart[t.dataset.id]=q;t.classList.toggle("over",!!p&&q>p.stock);updateTot();const sm=$("#sum");if(sm)sm.innerHTML=sumHTML();
  }
});

backend.sub(d=>{
  S=d;
  if(user&&user.role=="rep"&&!S.refs.some(r=>r.id===user.id)){user=null;try{sessionStorage.removeItem("u");}catch(e){}}
  render();
});
</script>
</body>
</html>
